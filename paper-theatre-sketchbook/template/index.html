<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>A tiny history of dinosaurs</title>
<!-- Style: paper-theatre-sketchbook. Per-video content is in config.js and scenes.js.
     The data-duration values, the title, the aria-label and the <audio> attributes
     below are stamped from config.js by `npm run sync`; edit config.js, not these. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:Caveat;src:url('assets/fonts/Caveat-700-latin.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Work Sans';src:url('assets/fonts/WorkSans-500-latin.woff2') format('woff2');font-weight:500;font-display:block}
*{box-sizing:border-box}
body{margin:0;background:#f4f0df}
#root{width:100%;height:100%;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.clip{position:absolute;inset:0}
#progress{position:absolute;left:88px;bottom:42px;width:1744px;height:3px;background:#a65b34;transform-origin:left center}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="47.5" data-width="1920" data-height="1080">
<canvas id="art" class="clip" data-start="0" data-duration="47.5" data-track-index="0" width="1920" height="1080" aria-label="Two illustrated views of dinosaur history"></canvas>
<div id="progress"></div>
<audio id="soundtrack" src="assets/music/soundtrack.m4a" data-start="0" data-duration="47.5" data-track-index="1" data-volume="1" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":45.5,"v":1},{"t":47.5,"v":0}]}]}'></audio>
</div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
// One paused root timeline. A single tween drives a time value and redraws the canvas
// on every update, so every frame is drawFrame(seconds). Registered only after the
// fonts load and the build finishes (registering earlier renders blank).
window.PaperTheatre.ready().then(() => {
  const { offset, length, total } = window.PaperTheatre.span;
  const driver = { time: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(driver, { time: length, duration: length, ease: 'none', onUpdate: () => window.PaperTheatre.drawFrame(driver.time) }, 0);
  tl.fromTo('#progress', { scaleX: offset / total }, { scaleX: (offset + length) / total, duration: length, ease: 'none' }, 0);
  window.__timelines.main = tl;
});
</script></body></html>
